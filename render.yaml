# Render Blueprint: New > Blueprint > pick this repo. Free plan, Docker.
services:
  - type: web
    name: withdrawal-copilot
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false        # Render asks you to paste it during setup
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: DEMO_TODAY
        value: "2026-10-04"
